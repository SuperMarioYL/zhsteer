<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" data-palette="56e6da-6aafe7-acf6d5-5f14a37288f4"><style>text{font-family:'Space Grotesk','PingFang SC','Noto Sans SC','Segoe UI',system-ui,sans-serif}text{fill:#132a2e}.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
@keyframes zsmarch{to{stroke-dashoffset:-32}}
.flow{stroke-dasharray:7 9;animation:zsmarch 1.5s linear infinite}
@keyframes zstravel{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(var(--dx,40px));opacity:0}}
.dot{animation:zstravel var(--dur,2.2s) ease-in-out infinite}
@keyframes zstravelv{0%{transform:translateY(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(var(--dy,40px));opacity:0}}
.dotv{animation:zstravelv var(--dur,2.2s) ease-in-out infinite}
@keyframes zsglow{0%,100%{opacity:.3}50%{opacity:.8}}
.glow{animation:zsglow 3.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.flow,.dot,.dotv,.glow{animation:none}}
</style><rect width="1000" height="470" rx="16" fill="#f7fefd" stroke="#cbf7f4"/><line x1="300" y1="235" x2="270" y2="66" stroke="#30807a" stroke-width="1.3" opacity=".45" class="flow"/><line x1="300" y1="235" x2="119" y2="235" stroke="#30807a" stroke-width="1.3" opacity=".45" class="flow"/><line x1="300" y1="235" x2="270" y2="404" stroke="#30807a" stroke-width="1.3" opacity=".45" class="flow"/><circle cx="300" cy="235" r="70" fill="none" stroke="#30807a" stroke-width="1.2" opacity=".4" class="glow"/><circle cx="300" cy="235" r="56" fill="#f3fdfc" stroke="#30807a" stroke-width="1.5"/><text x="300" y="229" font-size="18" fill="#30807a" class="mono" text-anchor="middle" font-weight="600">steer()</text><text x="300" y="251" font-size="11.5" fill="#557a84" text-anchor="middle">context manager</text><rect x="165" y="36" width="210" height="60" rx="12" fill="#f9fefe" stroke="#cbf7f4"/><text x="179" y="61" font-size="13" fill="#132a2e" font-weight="600">hook attached on entry</text><text x="179" y="82" font-size="12" fill="#557a84">removed on exit — even on raise</text><rect x="14" y="205" width="210" height="60" rx="12" fill="#f9fefe" stroke="#cbf7f4"/><text x="28" y="230" font-size="13" fill="#132a2e" font-weight="600">strength knob</text><text x="28" y="251" font-size="12" fill="#557a84">0 = off · 1.0 = fully projected</text><rect x="165" y="374" width="210" height="60" rx="12" fill="#f9fefe" stroke="#cbf7f4"/><text x="179" y="399" font-size="13" fill="#132a2e" font-weight="600">checksum verified on load</text><text x="179" y="420" font-size="12" fill="#557a84">model-tagged DirectionPack</text><line x1="360" y1="223" x2="498" y2="190" stroke="#30807a" stroke-width="1.3" opacity=".45" class="flow"/><circle cx="360" cy="223" r="3" fill="#30807a" opacity=".9" class="dot" style="--dx:138px;--dy:-33px"/><rect x="500" y="62" width="460" height="262" rx="12" fill="#f3fdfc" stroke="#cbf7f4"/><circle cx="518" cy="77" r="4" fill="#cbf7f4"/><circle cx="532" cy="77" r="4" fill="#cbf7f4"/><text x="946" y="82" font-size="11" fill="#557a84" class="mono" text-anchor="end">examples/steer_demo.py</text><line x1="500" y1="92" x2="960" y2="92" stroke="#cbf7f4"/><text x="518" y="114" font-size="14" fill="#30807a" class="mono">from zhsteer import load, steer</text><text x="518" y="140" font-size="14" fill="#132a2e" class="mono">pack = load(&quot;packs/qwen3-4b.pack&quot;)</text><text x="518" y="166" font-size="14" fill="#132a2e" class="mono">with steer(model, pack, strength=0.9):</text><text x="518" y="192" font-size="14" fill="#132a2e" class="mono">    output = model.generate(**inputs)</text><text x="518" y="218" font-size="14" fill="#557a84" class="mono"># your existing generate() call, unchanged</text><rect x="500" y="356" width="460" height="56" rx="12" fill="#f9fefe" stroke="#cbf7f4"/><text x="518" y="382" font-size="13.5" fill="#30807a" class="mono">zhsteer score — deterministic, no model needed</text><text x="518" y="402" font-size="11.5" fill="#557a84">the same lexicon the demo reports are built on</text></svg>
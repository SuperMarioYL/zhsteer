<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 880" width="700" height="880" data-palette="56e6da-6aafe7-acf6d5-5f14a37288f4"><style>text{font-family:'Space Grotesk','PingFang SC','Noto Sans SC','Segoe UI',system-ui,sans-serif}text{fill:#132a2e}.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
@keyframes zsmarch{to{stroke-dashoffset:-32}}
